{k:['rent','kiraya','dokan','center'],a:'Open <b>More → Rent</b>. Choose the property (Center, Dokan, Room…) and <b>I am: Paying</b> (you pay rent, deducted from profit) or <b>Collecting</b> (tenant pays you, added to income). Fill “Paid / received” as money moves, or tap Mark paid / Mark received.'},
{k:['bill','electricity','gas','water','internet','wapda'],a:'Open <b>More → Bills</b> and add the bill with type, month and amount. Keep it <b>Unpaid</b> until you pay it, then tap <b>Mark paid</b>. Only paid bills reduce profit.'},
{k:['invoice','supplier','company','purchase','salesman'],a:'Open <b>Invoices → Add invoice</b>. Enter company, invoice no, total and what you paid. The balance shows as “Due”. Tap <b>Mark paid</b> when you clear it. Purchases are tracked as payables; profit comes from your sales entries.'},
{k:['mark paid','settle','mark returned','received'],a:'On any card with a balance, tap <b>Mark paid / returned / received</b> to settle it in full. For part payment, tap <b>Edit</b> and change the paid amount.'},
{k:['delete','undo','remove','galat'],a:'Tap <b>Delete</b> on a card. A bar appears at the bottom for 5 seconds with <b>Undo</b>. Use <b>Edit</b> to correct mistakes.'},
{k:['backup','restore','data lost','new phone','save data'],a:'Open <b>More → Backup</b>, tap <b>Copy backup</b> and save it in Notes or WhatsApp. On a new phone, paste it into Backup and tap <b>Restore</b>. Do this every week.'},
{k:['install','shortcut','home screen'],a:'Open the app link in Chrome and tap the <b>Install app</b> button in the header (or Chrome menu ⋮ → Install app). On iPhone use Safari → Share → Add to Home Screen.'},
{k:['password','forgot','otp','login','reset','security'],a:'Forgot it? On the login screen tap <b>Forgot password?</b>, enter your registered mobile number, and a 6-digit code appears on screen. Enter it and choose a new password. You can change the password or recovery number in <b>More → Security</b>.'},
{k:['theme','dark','light','night'],a:'Tap the <b>Theme</b> button in the top bar to switch between light and dark mode.'},

function ans(t){const x=' '+t.toLowerCase().replace(/[^a-z0-9 ]/g,' ')+' ';let b=null,bs=0;for(const e of KB){let s=0;for(const k of e.k)if(x.includes(k.trim()=='hi'?' hi ':k))s+=k.length;if(s>bs){bs=s;b=e}}return b?(typeof b.a=='function'?b.a():b.a):'I can help with: <b>profit, add sale, expenses, salary, loans, rent, bills, invoices, backup, forgot password, install</b>. Try one of these words.'}
function say(h,c){const m=$('#am');m.insertAdjacentHTML('beforeend',`<div class="mb ${c}">${h}</div>`);m.scrollTop=m.scrollHeight}
function ask(t){t=t.trim();if(!t)return;say(esc(t),'u');$('#ain').value='';const m=$('#am');m.insertAdjacentHTML('beforeend','<div class="mb b" id="ty">…</div>');m.scrollTop=m.scrollHeight;setTimeout(()=>{const e=$('#ty');if(e)e.remove();say(ans(t),'b')},450)}
function chat(){const p=$('#ai');p.hidden=false;if(!$('#am').children.length){say('Hi! I am <b>Medi Assistant</b>. I can explain every part of this app and answer questions about your numbers. What do you need?','b');$('#aq').innerHTML=['What is my profit?','How to add a sale','How is salary counted','Forgot password','How to back up','What is due?'].map(s=>`<button>${s}</button>`).join('');$('#aq').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent))}$('#ain').focus()}
$('#fab').innerHTML=ico(IC.ai);$('#aho').innerHTML=ico(IC.ai);$('#fab').onclick=chat;$('#ax').onclick=()=>$('#ai').hidden=true;$('#asd').onclick=()=>ask($('#ain').value);$('#ain').onkeydown=e=>{if(e.key=='Enter')ask($('#ain').value)};
